# CI for streamslop digging game. Per GDD §13: CI enforces exactly one
# real thing -- the credits. It enforces nothing about gameplay; the
# feel checklist (docs/ROADMAP.md §4) is the gameplay gate and is run
# by hand, forever. The second job is a cultural document.
name: ci
on: [push, pull_request]

jobs:
  attribution-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every asset must be credited
        run: python3 tools/attr_lint.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: there are no tests
        run: echo "There are no tests. There will never be tests."
